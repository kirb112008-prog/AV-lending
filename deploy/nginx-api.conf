# Сервер заявок на поддомене. Положить в /etc/nginx/sites-available/api.example.ru
# (замените example.ru на свой домен; порт 3000 должен совпадать с PORT в .env сервера)

# не больше 30 запросов в минуту с одного адреса (сам WordPress ограничивает ещё и заявки)
limit_req_zone $binary_remote_addr zone=leads:10m rate=30r/m;

server {
    listen 80;
    server_name api.example.ru;

    client_max_body_size 20k;

    location / {
        limit_req zone=leads burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
