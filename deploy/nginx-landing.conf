# Лендинг на WordPress. Положить в /etc/nginx/sites-available/example.ru
# (замените example.ru на свой домен и проверьте имя сокета PHP: ls /run/php/)
server {
    listen 80;
    server_name example.ru www.example.ru;

    root /var/www/example.ru;
    index index.php;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 30d;
        access_log off;
    }

    # не отдавать скрытые файлы и не принимать старый удалённый вызов WordPress
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /xmlrpc.php {
        deny all;
    }
}
